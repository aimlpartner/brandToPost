<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A0A0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="BrandToPost" />
  <link rel="apple-touch-icon"
    href="/B2PLOGO.png" />
  <link rel="icon" type="image/png"
    href="/B2PLOGO.png" />
  <title>BrandToPostUAT</title>
  <style>
    body {
      margin: 0;
      background-color: #0A0A0F;
      font-family: 'Inter Tight', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    #root {
      min-height: 100vh;
    }

    /* Splash Screen Styles */
    .splash-container {
      position: fixed;
      inset: 0;
      background-color: #0A0A0F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .splash-logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: auto;
      margin-top: auto;
    }

    .logo-glow {
      position: absolute;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.4) 0%, rgba(37, 131, 235, 0.2) 50%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      animation: pulse-glow 2s ease-in-out infinite alternate;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      position: relative;
      z-index: 1;
      animation: logo-scale 1.5s ease-out;
    }

    .splash-footer {
      margin-bottom: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .footer-glow {
      position: absolute;
      width: 200px;
      height: 60px;
      background: radial-gradient(ellipse, rgba(124, 58, 237, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .splash-from {
      font-size: 10px;
      letter-spacing: 0.25em;
      color: #64748B;
      font-weight: 600;
      font-family: monospace;
    }

    .splash-parent-logo {
      height: 36px;
      width: auto;
      object-fit: contain;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    @keyframes pulse-glow {
      from {
        transform: scale(0.9);
        opacity: 0.6;
      }

      to {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes logo-scale {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="splash-container">
      <div class="splash-logo-wrapper">
        <div class="logo-glow"></div>
        <img src="/B2PLOGO.png"
          alt="BrandToPost Logo" class="splash-logo" />
      </div>
      <div class="splash-footer">
        <div class="footer-glow"></div>
        <span class="splash-from">FROM</span>
        <img
          src="/Mascot.png"
          alt="Parent Company Logo" class="splash-parent-logo" />
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
