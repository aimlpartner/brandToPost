name: Deploy to UAT (brandtopost.com)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Create local .htaccess for Passenger
        run: |
          cat << 'EOF' > .htaccess
          PassengerEnabled on
          PassengerAppRoot /home/u769235882/domains/brandtopost.com/public_html/uat
          PassengerAppType node
          PassengerNodejs /opt/alt/alt-nodejs22/root/usr/bin/node
          PassengerStartupFile server.js
          PassengerBaseURI /
          PassengerRestartDir /home/u769235882/domains/brandtopost.com/public_html/uat/tmp
          EOF

      - name: Prepare deployment folder
        run: |
          mkdir deploy_temp
          cp -r dist deploy_temp/
          cp server.js deploy_temp/
          cp package.json deploy_temp/
          cp package-lock.json deploy_temp/
          cp .htaccess deploy_temp/
          # Create Passenger restart trigger so the app restarts on FTP deploy
          mkdir -p deploy_temp/tmp
          touch deploy_temp/tmp/restart.txt

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./deploy_temp/
          server-dir: public_html/uat/

      - name: Post-deployment commands via SSH
        uses: appleboy/ssh-action@master
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST || secrets.FTP_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script: |
            # Remove default landing page if exists
            rm -f /home/u769235882/domains/brandtopost.com/public_html/uat/default.php
            
            # Setup environment and run npm install with memory-saving options
            export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH
            cd /home/u769235882/domains/brandtopost.com/public_html/uat
            npm install --omit=dev --no-audit --no-fund --jobs=1
            
            # Restart application
            mkdir -p tmp
            touch tmp/restart.txt
